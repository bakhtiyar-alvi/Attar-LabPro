      // --- SCREEN 6: BATCH COMPOUNDING & GRAVIMETRIC CUMULATIVE SCALE MODE ---
      renderBatch(vp) {
        const f = this.activeFormula;
        const rowsToCompound = this.batchFlattenMode
          ? FormulaEngine.flattenFormula(f.ingredients, this.formulaMap)
          : f.ingredients;

        const cumWeights = FormulaEngine.calcCumulativeWeights(rowsToCompound, f.targetBatchSize);

        vp.innerHTML = `
          <div class="panel">
            <div class="panel-head">
              <div>
                <span class="panel-title">Gravimetric Compounding Sheet: ${f.name}</span>
                <div class="hud-sub">Check off rows as you pour onto your scale. Σ Cumulative column shows target scale reading without re-taring.</div>
              </div>
              <div style="display:flex;gap:6px;flex-wrap:wrap;">
                <button class="btn ${this.batchFlattenMode ? "btn-gold" : "btn-outline"} btn-sm" id="btn-toggle-flatten">
                  ${this.batchFlattenMode ? "✓ Sub-Accords Flattened" : "Flatten Nested Sub-Accords"}
                </button>
                <button class="btn btn-gold btn-sm" id="btn-deduct-stock">Deduct Stock</button>
                <button class="btn btn-outline btn-sm" onclick="window.print()">Print</button>
              </div>
            </div>
            <div class="panel-body">
              <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;">
                ${[10, 25, 50, 100, 250, 500, 1000].map(sz => `
                  <button class="btn ${f.targetBatchSize === sz ? "btn-gold" : "btn-outline"} btn-sm" data-preset-sz="${sz}">${sz}g</button>
                `).join("")}
              </div>

              <div class="table-scroll">
                <table class="data-table">
                  <thead>
                    <tr>
                      <th style="width:42px;">Poured</th>
                      <th>Material / Component</th>
                      <th>Dilution</th>
                      <th>% w/w</th>
                      <th>Pour Mass (g)</th>
                      <th>Σ Scale Target (g)</th>
                      <th>Stock Status</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${rowsToCompound.map((row, idx) => {
                      const isAccord = row.type === "accord";
                      const ing = !isAccord ? (this.ingMap[row.ingredientId] || {}) : {};
                      const name = isAccord
                        ? `❖ ${this.formulaMap[row.subFormulaId]?.name || row.nameSnapshot}`
                        : (ing.name || row.nameSnapshot || "Unknown");
                      const { mass, cumulative } = cumWeights[idx];
                      const avail = ing.stockGrams || 0;
                      const short = !isAccord && avail < mass;
                      const checkKey = `${f.id}_${idx}`;
                      const isChecked = Boolean(this.weighedChecks[checkKey]);

                      return `
                        <tr class="${isChecked ? "weighed-row" : ""}" id="batch-row-${idx}">
                          <td><input type="checkbox" data-weigh-chk="${checkKey}" data-row-i="${idx}" ${isChecked ? "checked" : ""} style="width:18px;height:18px;cursor:pointer;"></td>
                          <td><strong>${name}</strong></td>
                          <td class="input-mono">${row.dilution ?? 100}% ${row.solvent && row.solvent !== "Neat" ? `in ${row.solvent}` : "Neat"}</td>
                          <td class="input-mono">${Number(row.percentage).toFixed(2)}%</td>
                          <td class="input-mono" style="color:var(--accent-gold-bright);font-weight:700;">${mass.toFixed(3)} g</td>
                          <td class="input-mono" style="color:#56cfe1;font-weight:700;">${cumulative.toFixed(3)} g</td>
                          <td>
                            ${isAccord
                              ? `<span class="accord-pill">Premix</span>`
                              : `<span class="status-pill ${short ? "pill-err" : "pill-ok"}">${avail.toFixed(1)} g ${short ? "(Low)" : ""}</span>`}
                          </td>
                        </tr>
                      `;
                    }).join("")}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        `;

        vp.querySelector("#btn-toggle-flatten").onclick = () => {
          this.batchFlattenMode = !this.batchFlattenMode;
          this.renderBatch(vp);
        };

        vp.querySelectorAll("[data-weigh-chk]").forEach(chk => {
          chk.onchange = e => {
            const key = chk.getAttribute("data-weigh-chk");
            const rowI = chk.getAttribute("data-row-i");
            this.weighedChecks[key] = e.target.checked;
            const tr = document.getElementById(`batch-row-${rowI}`);
            if (tr) tr.classList.toggle("weighed-row", e.target.checked);
          };
        });

        vp.querySelectorAll("[data-preset-sz]").forEach(btn => {
          btn.onclick = () => {
            this.activeFormula.targetBatchSize = Number(btn.getAttribute("data-preset-sz"));
            this.renderBatch(vp);
          };
        });

        vp.querySelector("#btn-deduct-stock").onclick = async () => {
          const flat = FormulaEngine.flattenFormula(f.ingredients, this.formulaMap);
          const ok = await this.confirmDialog(
            "Deduct Batch from Inventory?",
            `Subtract required raw material weights (including flattened sub-accords) for a ${f.targetBatchSize}g batch of "${f.name}"?`,
            "Deduct Stock"
          );
          if (!ok) return;
          for (const row of flat) {
            const ing = this.ingMap[row.ingredientId];
            if (ing) {
              const dilFactor = (row.dilution !== undefined ? Number(row.dilution) : 100) / 100;
              const used = FormulaEngine.calcMass(row.percentage, f.targetBatchSize) * dilFactor;
              ing.stockGrams = Math.max(0, Number((ing.stockGrams - used).toFixed(2)));
              await this.db.put("ingredients", ing);
            }
          }
          await this.reloadDatabase();
          this.toast("Inventory stock deducted");
          this.renderBatch(vp);
        };
      }

      renderDilution(vp) {

                <div>Concentrate Mass (M₁): <strong style="color:var(--accent-gold-bright)">${res.concentrateMass.toFixed(3)} g</strong></div>
                <div>Diluent / Carrier Mass: <strong style="color:#5ce09b">${res.diluentMass.toFixed(3)} g</strong></div>
                <div>Total Final Mass (M₂): <strong>${res.finalMass.toFixed(3)} g</strong></div>
              </div>

            box.style.display = "block";

          }
        };
        vp.querySelector("#btn-calc-dil").onclick = calc;
        calc();
      }

      // --- SCREEN 8: FORMULA COMPARISON ---
      renderComparison(vp) {
        const fA = this.formulas[0] || this.activeFormula;
        const fB = this.formulas[1] || this.activeFormula;
        vp.innerHTML = `
          <div class="panel">
            <div class="panel-head"><span class="panel-title">Side-by-Side Flattened Raw Material Comparison</span></div>
            <div class="panel-body">
              <div class="form-grid-2" style="margin-bottom:12px;">
                <select id="cmp-sel-a" class="select">
                  ${this.formulas.map(f => `<option value="${f.id}" ${f.id === fA.id ? "selected" : ""}>Formula A: ${f.name} (v${f.version || "1.0"})</option>`).join("")}
                </select>
                <select id="cmp-sel-b" class="select">
                  ${this.formulas.map(f => `<option value="${f.id}" ${f.id === fB.id ? "selected" : ""}>Formula B: ${f.name} (v${f.version || "1.0"})</option>`).join("")}
                </select>
              </div>
              <div class="table-scroll" id="cmp-table-box"></div>
            </div>
          </div>
        `;

        const updateTable = () => {
          const left = this.formulas.find(x => x.id === vp.querySelector("#cmp-sel-a").value) || fA;
          const right = this.formulas.find(x => x.id === vp.querySelector("#cmp-sel-b").value) || fB;
          const flatA = FormulaEngine.flattenFormula(left.ingredients, this.formulaMap);
          const flatB = FormulaEngine.flattenFormula(right.ingredients, this.formulaMap);

          const allIds = Array.from(new Set([...flatA.map(i => i.ingredientId), ...flatB.map(i => i.ingredientId)]));

          vp.querySelector("#cmp-table-box").innerHTML = `
            <table class="data-table">
              <thead>
                <tr>
                  <th>Raw Material (Flattened)</th>
                  <th>${left.name}</th>
                  <th>${right.name}</th>
                  <th>Delta (B − A)</th>
                </tr>
              </thead>
              <tbody>
                ${allIds.map(id => {
                  const ing = this.ingMap[id] || { name: id };
                  const pA = flatA.find(x => x.ingredientId === id)?.percentage || 0;
                  const pB = flatB.find(x => x.ingredientId === id)?.percentage || 0;
                  const diff = pB - pA;
                  return `
                    <tr>
                      <td><strong>${ing.name}</strong></td>
                      <td class="input-mono">${pA.toFixed(2)}%</td>
                      <td class="input-mono">${pB.toFixed(2)}%</td>

                      </td>
                    </tr>
                  `;
                }).join("")}
              </tbody>
            </table>
          `;
        };

        vp.querySelector("#cmp-sel-a").onchange = updateTable;
        vp.querySelector("#cmp-sel-b").onchange = updateTable;
        updateTable();
      }

      // --- SCREEN 9: COST & INVENTORY ---
      renderCosting(vp) {
        const f = this.activeFormula;
        const flat = FormulaEngine.flattenFormula(f.ingredients, this.formulaMap);
        let rawCost = 0;
        flat.forEach(r => {
          const ing = this.ingMap[r.ingredientId] || {};
          const dilFactor = (r.dilution !== undefined ? Number(r.dilution) : 100) / 100;
          const mass = FormulaEngine.calcMass(r.percentage, f.targetBatchSize) * dilFactor;
          rawCost += mass * ((ing.pricePerKg || 0) / 1000);
        });
        const costPerGram = rawCost / (f.targetBatchSize || 1);

        vp.innerHTML = `
          <div class="hud-grid">
            <div class="hud-card"><span class="hud-label">Batch Raw Cost</span><span class="hud-val">${this.currency}${rawCost.toFixed(2)}</span><span class="hud-sub">For ${f.targetBatchSize}g</span></div>
            <div class="hud-card"><span class="hud-label">Cost Per Gram</span><span class="hud-val">${this.currency}${costPerGram.toFixed(2)}</span><span class="hud-sub">Includes Sub-Accords</span></div>
            <div class="hud-card"><span class="hud-label">3g Quarter-Tola</span><span class="hud-val">${this.currency}${(costPerGram * 3 + 45).toFixed(0)}</span><span class="hud-sub">Incl. ${this.currency}45 vial</span></div>
            <div class="hud-card"><span class="hud-label">12g Full-Tola</span><span class="hud-val">${this.currency}${(costPerGram * 12 + 120).toFixed(0)}</span><span class="hud-sub">Incl. ${this.currency}120 bottle</span></div>
          </div>
        `;
      }

      renderLibrary(vp) {
        vp.innerHTML = `
          <div class="panel">
            <div class="panel-head">
              <span class="panel-title">Formulas & Reusable Sub-Accords (${this.formulas.length})</span>
            </div>
            <div class="panel-body" style="display:grid;gap:10px;">
              ${this.formulas.map(f => `
                <div class="ing-row-card ${f.isAccord ? "sub-accord-card" : ""}" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
                  <div>
                    <div class="ing-name">
                      ${f.name}

                    </div>
                    <div class="hud-sub">${f.ingredients.length} rows • ${f.targetBatchSize}g • Updated ${f.updatedAt || "Recently"}</div>

              `).join("")}
            </div>

        vp.querySelectorAll("[data-lib-open]").forEach(b => {
          b.onclick = () => {
            const f = this.formulas.find(x => x.id === b.getAttribute("data-lib-open"));
            if (f) {
              this.activeFormula = JSON.parse(JSON.stringify(f));
              this.setDirty(false);
              this.navigate("studio");
            }
          };
        });

        vp.querySelectorAll("[data-lib-nest]").forEach(b => {
          b.onclick = () => {
            const subId = b.getAttribute("data-lib-nest");
            const sub = this.formulaMap[subId];
            if (!sub) return;
            const tempMap = { ...this.formulaMap, [this.activeFormula.id]: this.activeFormula };
            if (FormulaEngine.hasCircularReference(this.activeFormula.id, subId, tempMap)) {
              this.toast("Cannot nest a formula inside itself (Circular Reference)");
              return;
            }
            this.pushUndoState();
            this.activeFormula.ingredients.push({
              type: "accord",
              subFormulaId: subId,
              nameSnapshot: sub.name,
              percentage: 10.0,
              dilution: 100,
              solvent: "Neat",
              locked: false,
              note: "Nested from Library"
            });
            this.setDirty(true);
            this.toast(`Nested "${sub.name}" into ${this.activeFormula.name}`);
            this.navigate("studio");
          };
        });

        vp.querySelectorAll("[data-lib-dup]").forEach(b => {
          b.onclick = async () => {
            const orig = this.formulas.find(x => x.id === b.getAttribute("data-lib-dup"));
            if (!orig) return;
            const copy = JSON.parse(JSON.stringify(orig));
            copy.id = "form_" + Date.now();
            copy.name = orig.name + " (Copy)";
            await this.db.put("formulas", copy);
            await this.reloadDatabase();
            this.toast("Duplicated");
            this.renderLibrary(vp);
          };
        });

        vp.querySelectorAll("[data-lib-del]").forEach(b => {
          b.onclick = async () => {
            const id = b.getAttribute("data-lib-del");
            const target = this.formulas.find(x => x.id === id);
            if (!target) return;
            const ok = await this.confirmDialog(`Delete "${target.name}"?`, "Permanently remove this formula/accord from your library?", "Delete");
            if (!ok) return;
            await this.db.delete("formulas", id);
            await this.reloadDatabase();
            this.toast("Deleted");
            this.renderLibrary(vp);
          };
        });
      }

      // --- SCREEN 11: SAFETY & IFRA REVIEW (RECURSIVE FLATTENED AUDIT) ---
      renderSafety(vp) {
        const f = this.activeFormula;
        const flatRows = FormulaEngine.flattenFormula(f.ingredients, this.formulaMap);

        vp.innerHTML = `
          <div class="panel">
            <div class="panel-head"><span class="panel-title">IFRA 51st Amendment Compliance Table (Flattened Raw Materials)</span></div>
            <div class="panel-body">
              <p class="hud-sub" style="margin-bottom:12px;">Nested sub-accords and pre-dilutions are automatically resolved to compute net active raw material percentages against IFRA Category 4 limits.</p>
              <div class="table-scroll">
                <table class="data-table">
                  <thead>
                    <tr>
                      <th>Raw Material</th>
                      <th>Gross %</th>
                      <th>Net Active %</th>
                      <th>IFRA Cat 4 Max</th>
                      <th>Verification Status</th>
                      <th>Result</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${flatRows.map(r => {
                      const ing = this.ingMap[r.ingredientId] || {};
                      const dil = r.dilution !== undefined ? Number(r.dilution) : 100;
                      const netActive = Number(r.percentage) * (dil / 100);
                      const max = ing.ifraLimitCat4 ?? 100;
                      const ok = netActive <= max;
                      return `
                        <tr>
                          <td><strong>${ing.name || r.nameSnapshot || "Unknown"}</strong></td>
                          <td class="input-mono">${Number(r.percentage).toFixed(2)}%</td>
                          <td class="input-mono" style="color:var(--accent-gold-bright)">${netActive.toFixed(3)}%</td>
                          <td class="input-mono">${max}%</td>
                          <td>${ing.verificationStatus || "Unverified"}</td>
                          <td><span class="status-pill ${ok ? "pill-ok" : "pill-err"}">${ok ? "COMPLIANT" : "EXCEEDS LIMIT"}</span></td>
                        </tr>
                      `;
                    }).join("")}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        `;
      }

      // --- SCREEN 12: QA MATH VERIFICATION SUITE (10 AUTOMATED TESTS) ---
      renderTests(vp) {
        const suite = [
          {
            name: "TEST 1: Percentage to Mass (25% of 100g = 25g)",
            pass: Math.abs(FormulaEngine.calcMass(25, 100) - 25.0) < 1e-6
          },
          {
            name: "TEST 2: Batch Scaling (60% & 40% on 250g = 150g & 100g)",
            pass: Math.abs(FormulaEngine.calcMass(60, 250) - 150) < 1e-6 && Math.abs(FormulaEngine.calcMass(40, 250) - 100) < 1e-6
          },
          {
            name: "TEST 3: Percentage Total Integrity (25% + 35% + 40% = 100%)",
            pass: Math.abs(FormulaEngine.sumPercentages([{ percentage: 25 }, { percentage: 35 }, { percentage: 40 }]) - 100) < 1e-6
          },
          {
            name: "TEST 4: Mass-to-Volume Conversion (10g @ 0.8 g/mL = 12.5 mL)",
            pass: Math.abs(FormulaEngine.massToVolume(10, 0.8) - 12.5) < 1e-6
          },
          {
            name: "TEST 5: Mass-Based Dilution (100% -> 20% w/w for 50g = 10g conc + 40g diluent)",
            pass: (() => {
              const r = FormulaEngine.calculateDilution(100, 20, 50);
              return Math.abs(r.concentrateMass - 10) < 1e-6 && Math.abs(r.diluentMass - 40) < 1e-6;
            })()
          },
          {
            name: "TEST 6: Invalid Zero Density Rejection",
            pass: (() => {
              try { FormulaEngine.massToVolume(10, 0); return false; } catch { return true; }
            })()
          },
          {
            name: "TEST 7: Auto-Balance Preserves Locked Ingredients & 100.00% Sum",
            pass: (() => {
              const init = [
                { ingredientId: "a", percentage: 50, locked: true },
                { ingredientId: "b", percentage: 30, locked: false },
                { ingredientId: "c", percentage: 20, locked: false }
              ];
              const res = FormulaEngine.autoBalance(init, 1, 40, "proportional");
              return res.success && res.ingredients[0].percentage === 50 && Math.abs(FormulaEngine.sumPercentages(res.ingredients) - 100) < 1e-5;
            })()
          },
          {
            name: "TEST 8: Nested Sub-Accord Flattening & Circular Reference Rejection",
            pass: (() => {
              const mockMap = {
                acc1: { id: "acc1", ingredients: [{ type: "accord", subFormulaId: "acc2", percentage: 100 }] },
                acc2: { id: "acc2", ingredients: [{ type: "ingredient", ingredientId: "x", percentage: 50 }, { type: "ingredient", ingredientId: "y", percentage: 50 }] }
              };
              const cycleDetected = FormulaEngine.hasCircularReference("acc2", "acc1", mockMap);
              const flat = FormulaEngine.flattenFormula([{ type: "accord", subFormulaId: "acc2", percentage: 20 }, { type: "ingredient", ingredientId: "x", percentage: 80 }], mockMap);
              const xMerged = flat.find(i => i.ingredientId === "x")?.percentage || 0;
              return cycleDetected === true && Math.abs(xMerged - 90.0) < 1e-5;
            })()
          },
          {
            name: "TEST 9: Active Aromatic Concentration under Pre-Dilution (10% @ 10% dil + 90% Neat = 91%)",
            pass: (() => {
              const active = FormulaEngine.calcActiveAromaticPercent([
                { percentage: 10, dilution: 10 },
                { percentage: 90, dilution: 100 }
              ]);
              return Math.abs(active - 91.0) < 1e-5;
            })()
          },
          {
            name: "TEST 10: Cumulative Gravimetric Bench Scale Target Calculation",
            pass: (() => {
              const cw = FormulaEngine.calcCumulativeWeights([{ percentage: 20 }, { percentage: 30 }, { percentage: 50 }], 200);
              return Math.abs(cw[0].cumulative - 40) < 1e-5 && Math.abs(cw[1].cumulative - 100) < 1e-5 && Math.abs(cw[2].cumulative - 200) < 1e-5;
            })()
          }
        ];

        vp.innerHTML = `
          <div class="panel">
            <div class="panel-head"><span class="panel-title">Automated Mathematical & Hierarchical QA Suite (10/10)</span></div>
            <div class="panel-body" style="display:grid;gap:8px;">
              ${suite.map(t => `
                <div class="ing-row-card" style="display:flex;justify-content:space-between;align-items:center;">
                  <span>${t.name}</span>
                  <span class="status-pill ${t.pass ? "pill-ok" : "pill-err"}">${t.pass ? "PASSED" : "FAILED"}</span>
                </div>
              `).join("")}
            </div>
          </div>
        `;
      }

      // --- SCREEN 13: BACKUP, RESTORE & SETTINGS ---
      renderSettings(vp) {
        vp.innerHTML = `
          <div class="panel" style="max-width:560px;margin:0 auto;">
            <div class="panel-head"><span class="panel-title">Studio Preferences, JSON Backup & Restore</span></div>
            <div class="panel-body" style="display:grid;gap:14px;">
              <div class="field-group">
                <label class="field-label">Interface Theme</label>
                <select id="pref-theme" class="select">
                  <option value="dark" ${document.documentElement.getAttribute("data-theme") === "dark" ? "selected" : ""}>Obsidian & Champagne Gold (Dark)</option>
                  <option value="light" ${document.documentElement.getAttribute("data-theme") === "light" ? "selected" : ""}>Parchment Ivory (Light)</option>
                </select>
              </div>

              <div class="field-group">
                <label class="field-label">Display Currency Symbol</label>
                <select id="pref-currency" class="select">
                  <option value="₹" ${this.currency === "₹" ? "selected" : ""}>₹ Indian Rupee (INR)</option>
                  <option value="$" ${this.currency === "$" ? "selected" : ""}>$ US Dollar (USD)</option>
                  <option value="€" ${this.currency === "€" ? "selected" : ""}>€ Euro (EUR)</option>
                  <option value="AED " ${this.currency === "AED " ? "selected" : ""}>AED Dirham</option>
                </select>
              </div>

              <div style="display:flex;gap:10px;flex-wrap:wrap;padding-top:10px;border-top:1px solid var(--border-subtle);">
                <button class="btn btn-gold" id="btn-backup-json">Export Full JSON Backup</button>
                <label class="btn btn-outline" style="cursor:pointer;">
                  Import JSON Backup
                  <input type="file" id="file-restore-json" accept=".json" style="display:none;">
                </label>
                <button class="btn btn-danger" id="btn-factory-reset">Reset Sample Database</button>
              </div>
            </div>
          </div>
        `;

        vp.querySelector("#pref-theme").onchange = e => {
          document.documentElement.setAttribute("data-theme", e.target.value);
        };

        vp.querySelector("#pref-currency").onchange = e => {
          this.currency = e.target.value;
          localStorage.setItem("attarlab_currency", this.currency);
          this.toast(`Currency updated to ${this.currency}`);
        };

        vp.querySelector("#btn-backup-json").onclick = () => {
          const payload = {
            app: "AttarLab Pro",
            schemaVersion: 3,
            exportedAt: new Date().toISOString(),
            ingredients: this.ingredients,
            formulas: this.formulas,
            attarLogs: this.attarLogs
          };
          const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = `AttarLabPro_Backup_${Date.now()}.json`;
          a.click();
          this.toast("Backup exported");
        };

        vp.querySelector("#file-restore-json").onchange = async e => {
          const file = e.target.files[0];
          if (!file) return;
          try {
            const text = await file.text();
            const data = JSON.parse(text);
            if (!Array.isArray(data.ingredients) || !Array.isArray(data.formulas)) {
              throw new Error("Invalid backup file structure.");
            }
            for (const ing of data.ingredients) await this.db.put("ingredients", ing);
            for (const form of data.formulas) await this.db.put("formulas", form);
            if (Array.isArray(data.attarLogs)) {
              for (const log of data.attarLogs) await this.db.put("attar_logs", log);
            }
            await this.reloadDatabase();
            this.activeFormula = JSON.parse(JSON.stringify(this.formulas[0]));
            this.toast(`Restored ${data.ingredients.length} materials & ${data.formulas.length} formulas`);
            this.navigate("studio");
          } catch (err) {
            this.toast("Restore failed: " + err.message);
          }
        };

        vp.querySelector("#btn-factory-reset").onclick = async () => {
          const ok = await this.confirmDialog(
            "Reset to Factory Sample Data?",
            "This will erase custom records and restore the default Kannauj Attar & Sub-Accord database.",
            "Reset Database"
          );
          if (!ok) return;
          indexedDB.deleteDatabase("AttarLabPro_v2");
          location.reload();
        };
      }
    }

       // --- 4. PWA INSTALL PROMPT & PNG ICON GENERATOR ---
    let deferredInstallPrompt = null;

    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredInstallPrompt = e;

      const actionsBar = document.querySelector(".topbar-actions");
      if (actionsBar && !document.getElementById("btn-pwa-install")) {
        const installBtn = document.createElement("button");
        installBtn.id = "btn-pwa-install";
        installBtn.className = "btn btn-gold btn-sm";
        installBtn.textContent = "📲 Install";
        installBtn.onclick = async () => {
          if (!deferredInstallPrompt) return;
          deferredInstallPrompt.prompt();
          await deferredInstallPrompt.userChoice;
          deferredInstallPrompt = null;
          installBtn.remove();
        };
        actionsBar.prepend(installBtn);
      }
    });

    // Helper to generate real icon-192.png & icon-512.png from logo.svg
    window.downloadPWAIcons = async () => {
      const res = await fetch("./logo.svg");
      const svgText = await res.text();
      const svgBlob = new Blob([svgText], { type: "image/svg+xml;charset=utf-8" });
      const url = URL.createObjectURL(svgBlob);

      for (const size of [192, 512]) {
        const img = new Image();
        await new Promise((resolve) => {
          img.onload = resolve;
          img.src = url;
        });
        const canvas = document.createElement("canvas");
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, size, size);

        const pngUrl = canvas.toDataURL("image/png");
        const a = document.createElement("a");
        a.href = pngUrl;
        a.download = `icon-${size}.png`;
        a.click();
      }
      URL.revokeObjectURL(url);
    };

    window.addEventListener("DOMContentLoaded", () => {
      const app = new AttarLabStudio();
      app.init();
    });

    if ("serviceWorker" in navigator && location.protocol !== "file:") {
      navigator.serviceWorker.register("./service-worker.js").catch(() => {});
    }
      </script>
</body>
</html>
