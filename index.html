<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="AttarLab Pro - Professional Attar, Essential Oil & Perfumery Formulation Studio">
  <meta name="theme-color" content="#0a0c10">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
    <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="./logo.svg">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <title>AttarLab Pro | Perfumery & Attar Studio</title>
  <style>
    :root {
      --bg-base: #090b0e;
      --bg-surface: #11141b;
      --bg-elevated: #171b24;
      --bg-card: #1c212c;
      --bg-input: #10131a;
      --border-subtle: rgba(255, 255, 255, 0.07);
      --border-gold: rgba(212, 175, 55, 0.28);
      --accent-gold: #d4af37;
      --accent-gold-bright: #e6c65a;
      --accent-gold-soft: rgba(212, 175, 55, 0.14);
      --accent-amber: #d9822b;
      --text-primary: #f4f1ea;
      --text-secondary: #a6a092;
      --text-muted: #6e695f;
      --status-ok: #3ea874;
      --status-ok-bg: rgba(62, 168, 116, 0.14);
      --status-warn: #e09f3e;
      --status-warn-bg: rgba(224, 159, 62, 0.14);
      --status-err: #d9534f;
      --status-err-bg: rgba(217, 83, 79, 0.14);
      --font-display: Georgia, "Times New Roman", serif;
      --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: ui-monospace, "SF Mono", "JetBrains Mono", Consolas, monospace;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --shadow-card: 0 6px 24px rgba(0, 0, 0, 0.38);
      --nav-height: 64px;
      --topbar-height: 56px;
    }

    [data-theme="light"] {
      --bg-base: #f4f1ea;
      --bg-surface: #ebe5d8;
      --bg-elevated: #ffffff;
      --bg-card: #ffffff;
      --bg-input: #f5f2eb;
      --border-subtle: rgba(0, 0, 0, 0.09);
      --border-gold: rgba(158, 123, 34, 0.35);
      --accent-gold: #9e7b22;
      --accent-gold-bright: #7d5f14;
      --accent-gold-soft: rgba(158, 123, 34, 0.12);
      --text-primary: #1a1815;
      --text-secondary: #5c564b;
      --text-muted: #8c8578;
      --shadow-card: 0 4px 16px rgba(0, 0, 0, 0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg-base);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.45;
      overscroll-behavior: none;
    }

    /* App Shell Layout */
    .app-shell {
      display: flex;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
    }

    /* Desktop Sidebar */
    .sidebar {
      width: 248px;
      background: var(--bg-surface);
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      z-index: 30;
    }

    .brand-box {
      padding: 18px 16px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-crest {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, rgba(212,175,55,0.22), rgba(212,175,55,0.05));
      border: 1px solid var(--border-gold);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-gold);
      flex-shrink: 0;
    }

    .brand-name {
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 1.2px;
      color: var(--accent-gold);
    }

    .brand-tag {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-secondary);
    }

    .sidebar-nav {
      flex: 1;
      overflow-y: auto;
      padding: 10px 8px;
      list-style: none;
    }

    .nav-section-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      padding: 10px 10px 4px;
      font-weight: 600;
    }

    .nav-btn {
      width: 100%;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s ease;
      margin-bottom: 2px;
    }

    .nav-btn svg {
      width: 17px;
      height: 17px;
      fill: currentColor;
      flex-shrink: 0;
    }

    .nav-btn:hover {
      background: var(--accent-gold-soft);
      color: var(--text-primary);
    }

    .nav-btn.active {
      background: var(--accent-gold-soft);
      border-color: var(--border-gold);
      color: var(--accent-gold-bright);
      font-weight: 600;
    }

    /* Main Workspace Area */
    .main-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      height: 100dvh;
      overflow: hidden;
    }

    /* Top Header Bar */
    .topbar {
      height: var(--topbar-height);
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      gap: 8px;
      flex-shrink: 0;
      z-index: 20;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .mobile-crest {
      display: none;
      width: 30px;
      height: 30px;
      border-radius: 7px;
      background: var(--accent-gold-soft);
      border: 1px solid var(--border-gold);
      align-items: center;
      justify-content: center;
      color: var(--accent-gold);
      flex-shrink: 0;
    }

    .screen-title {
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    /* Scrollable Viewport */
    .viewport {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 14px;
      -webkit-overflow-scrolling: touch;
    }

    /* Buttons & Badges */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 13px;
      border-radius: var(--radius-sm);
      font-size: 12.5px;
      font-weight: 600;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
      font-family: var(--font-sans);
    }

    .btn svg {
      width: 15px;
      height: 15px;
      fill: currentColor;
    }

    .btn-gold {
      background: linear-gradient(180deg, var(--accent-gold-bright), var(--accent-gold));
      color: #090b0e;
      box-shadow: 0 2px 10px rgba(212, 175, 55, 0.25);
    }

    .btn-gold:active { transform: scale(0.98); }

    .btn-outline {
      background: var(--bg-elevated);
      border-color: var(--border-subtle);
      color: var(--text-primary);
    }

    .btn-outline:hover, .btn-outline:active {
      border-color: var(--border-gold);
      color: var(--accent-gold-bright);
    }

    .btn-danger {
      background: var(--status-err-bg);
      border-color: rgba(217, 83, 79, 0.4);
      color: #ff8582;
    }

    .btn-sm {
      padding: 5px 9px;
      font-size: 11.5px;
    }

    .btn-icon {
      width: 32px;
      height: 32px;
      padding: 0;
      border-radius: var(--radius-sm);
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      font-family: var(--font-mono);
    }

    .pill-ok { background: var(--status-ok-bg); color: #5ce09b; border: 1px solid rgba(62, 168, 116, 0.35); }
    .pill-warn { background: var(--status-warn-bg); color: #ffc164; border: 1px solid rgba(224, 159, 62, 0.35); }
    .pill-err { background: var(--status-err-bg); color: #ff8582; border: 1px solid rgba(217, 83, 79, 0.35); }

    /* KPI / Summary HUD Grid */
    .hud-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }

    .hud-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 11px 13px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .hud-label {
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-secondary);
      font-weight: 600;
    }

    .hud-val {
      font-family: var(--font-mono);
      font-size: 17px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .hud-sub {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* Studio Split Layout */
    .studio-layout {
      display: grid;
      grid-template-columns: 1.35fr 0.95fr;
      gap: 14px;
      align-items: start;
    }

    .panel {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-card);
      overflow: hidden;
      margin-bottom: 14px;
    }

    .panel-head {
      padding: 12px 14px;
      background: var(--bg-elevated);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .panel-title {
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 700;
      color: var(--accent-gold);
      letter-spacing: 0.4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .panel-body {
      padding: 14px;
    }

    /* Inputs & Controls */
    .input, .select {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      padding: 8px 11px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-family: var(--font-sans);
      outline: none;
      transition: border-color 0.15s;
    }

    .input:focus, .select:focus {
      border-color: var(--accent-gold);
    }

    .input-mono {
      font-family: var(--font-mono);
      text-align: right;
    }

    /* Formula Meta Toolbar */
    .formula-toolbar {
      display: grid;
      grid-template-columns: 1.5fr 1fr 1fr;
      gap: 10px;
      padding: 12px 14px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .field-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-secondary);
      font-weight: 600;
    }

    /* Ingredient Formulation Card List (Mobile & Desktop Friendly) */
    .ing-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 12px;
    }

    .ing-row-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 10px 12px;
      transition: border-color 0.15s;
    }

    .ing-row-card.is-locked {
      border-color: rgba(212, 175, 55, 0.35);
      background: linear-gradient(90deg, rgba(212, 175, 55, 0.05), transparent);
    }

    .ing-row-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    .ing-row-title-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1;
    }

    .lock-toggle {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-elevated);
      color: var(--text-muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .lock-toggle.locked {
      color: var(--accent-gold);
      border-color: var(--border-gold);
      background: var(--accent-gold-soft);
    }

    .ing-name {
      font-weight: 600;
      font-size: 13.5px;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .ing-cat-badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--bg-elevated);
      color: var(--text-secondary);
      border: 1px solid var(--border-subtle);
      white-space: nowrap;
    }

    .ing-mass-readout {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 700;
      color: var(--accent-gold-bright);
      background: var(--accent-gold-soft);
      padding: 3px 8px;
      border-radius: 5px;
      white-space: nowrap;
    }

    .ing-row-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .range-slider {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 6px;
      border-radius: 999px;
      background: var(--bg-elevated);
      outline: none;
      cursor: pointer;
    }

    .range-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--accent-gold-bright);
      border: 2px solid #090b0e;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
      cursor: pointer;
    }

    .range-slider:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .step-btn {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-elevated);
      color: var(--text-primary);
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .step-btn:active {
      background: var(--accent-gold-soft);
      border-color: var(--border-gold);
    }

    .pct-input-wrap {
      display: flex;
      align-items: center;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding-right: 6px;
      width: 82px;
      flex-shrink: 0;
    }

    .pct-input {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-size: 12.5px;
      font-weight: 600;
      padding: 5px 4px 5px 6px;
      text-align: right;
      outline: none;
    }

    .pct-unit {
      font-size: 11px;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }

    /* Visualizations & Note Pyramid */
    .radar-stage {
      width: 100%;
      min-height: 250px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 8px;
    }

    .pyramid-stack {
      display: flex;
      height: 22px;
      border-radius: var(--radius-sm);
      overflow: hidden;
      border: 1px solid var(--border-subtle);
      margin: 10px 0 8px;
      background: var(--bg-surface);
    }

    .pyr-bar-top { background: linear-gradient(90deg, #4ea8de, #56cfe1); transition: width 0.25s; }
    .pyr-bar-heart { background: linear-gradient(90deg, #e07a5f, #f2cc8f); transition: width 0.25s; }
    .pyr-bar-base { background: linear-gradient(90deg, #9c6644, #d4af37); transition: width 0.25s; }

    .pyramid-legend-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      text-align: center;
    }

    .pyr-chip {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 6px;
      font-size: 11px;
    }

    /* Accord Profile Bars */
    .profile-bar-row {
      display: grid;
      grid-template-columns: 74px 1fr 38px;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
      font-size: 11.5px;
    }

    .profile-track {
      height: 7px;
      background: var(--bg-surface);
      border-radius: 999px;
      overflow: hidden;
    }

    .profile-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent-amber), var(--accent-gold-bright));
      border-radius: 999px;
      transition: width 0.25s ease;
    }

    /* Mobile Bottom Navigation & Drawer */
    .mobile-bottom-nav {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: calc(var(--nav-height) + env(safe-area-inset-bottom, 0px));
      padding-bottom: env(safe-area-inset-bottom, 0px);
      background: rgba(17, 20, 27, 0.96);
      backdrop-filter: blur(14px);
      border-top: 1px solid var(--border-subtle);
      z-index: 45;
      justify-content: space-around;
      align-items: center;
    }

    .mob-tab {
      flex: 1;
      height: 100%;
      background: none;
      border: none;
      color: var(--text-secondary);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-size: 10.5px;
      font-weight: 600;
      cursor: pointer;
    }

    .mob-tab svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .mob-tab.active {
      color: var(--accent-gold-bright);
    }

    /* Modal & Bottom Sheet System */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(3px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 14px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-card {
      background: var(--bg-card);
      border: 1px solid var(--border-gold);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 560px;
      max-height: 86dvh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.65);
      overflow: hidden;
    }

    .modal-head {
      padding: 14px 16px;
      background: var(--bg-elevated);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-body {
      padding: 16px;
      overflow-y: auto;
      flex: 1;
    }

    /* Responsive Tables (For Desktop & Scrollable Cards) */
    .table-scroll {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 480px;
    }

    .data-table th {
      text-align: left;
      padding: 10px 12px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-secondary);
      background: var(--bg-elevated);
      border-bottom: 1px solid var(--border-subtle);
    }

    .data-table td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border-subtle);
      font-size: 13px;
    }

    /* Mobile Android Breakpoints */
    @media (max-width: 920px) {
      .sidebar { display: none; }
      .mobile-crest { display: inline-flex; }
      .mobile-bottom-nav { display: flex; }
      .viewport {
        padding: 10px 10px calc(var(--nav-height) + env(safe-area-inset-bottom, 0px) + 16px) 10px;
      }
      .hud-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
      }
      .studio-layout {
        grid-template-columns: 1fr;
      }
      .formula-toolbar {
        grid-template-columns: 1fr 1fr;
      }
      .formula-toolbar .field-group:first-child {
        grid-column: 1 / -1;
      }
      .ing-row-top {
        flex-wrap: wrap;
      }
    }

    @media print {
      .sidebar, .topbar, .mobile-bottom-nav, .no-print { display: none !important; }
      html, body, .app-shell, .main-area, .viewport {
        height: auto !important;
        overflow: visible !important;
        background: #fff !important;
        color: #000 !important;
      }
      .panel, .ing-row-card, .hud-card {
        border: 1px solid #ccc !important;
        box-shadow: none !important;
        background: #fff !important;
        color: #000 !important;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">

        visited.add(candidateId);

        const candidateFormula = formulaMap[candidateId];
        if (!candidateFormula || !Array.isArray(candidateFormula.ingredients)) return false;

        for (const item of candidateFormula.ingredients) {
          if (item.type === "accord" && item.subFormulaId) {
            if (item.subFormulaId === parentId) return true;
            if (this.hasCircularReference(parentId, item.subFormulaId, formulaMap, new Set(visited))) {
              return true;
            }
          }
        }
        return false;
      }

      /**
       * Recursively expands all nested sub-accords into flat raw material percentages,
       * merging duplicate raw materials and preserving effective active dilutions.
       */
      static flattenFormula(ingredients, formulaMap, depth = 0) {
        if (depth > 12) throw new Error("Maximum sub-accord nesting depth (12) exceeded.");
        const mergedMap = new Map();

        const processList = (items, scaleFactor) => {
          const listTotal = this.sumPercentages(items) || 100;
          for (const row of items) {
            const rowPct = Number(row.percentage) || 0;
            const effectivePct = (rowPct / listTotal) * 100 * scaleFactor;
            const rowDil = row.dilution !== undefined ? Number(row.dilution) : 100;

            if (row.type === "accord" && row.subFormulaId && formulaMap[row.subFormulaId]) {
              const childFormula = formulaMap[row.subFormulaId];
              processList(childFormula.ingredients, (effectivePct / 100) * (rowDil / 100));
            } else {
              const key = row.ingredientId || row.nameSnapshot;
              if (!key) continue;
              const prev = mergedMap.get(key);
              if (prev) {
                const prevActive = prev.percentage * (prev.dilution / 100);
                const addActive = effectivePct * (rowDil / 100);
                const newTotalPct = prev.percentage + effectivePct;
                const blendedDil = newTotalPct > 0 ? ((prevActive + addActive) / newTotalPct) * 100 : 100;
                prev.percentage = newTotalPct;
                prev.dilution = Number(blendedDil.toFixed(2));
                if (row.subSource && !prev.note.includes(row.subSource)) {
                  prev.note = prev.note ? `${prev.note} + ${row.subSource}` : `From ${row.subSource}`;
                }
              } else {
                mergedMap.set(key, {
                  type: "ingredient",
                  ingredientId: row.ingredientId,
                  nameSnapshot: row.nameSnapshot,
                  percentage: effectivePct,
                  dilution: rowDil,
                  solvent: row.solvent || "Neat",
                  locked: false,
                  note: row.note || ""
                });
              }
            }
          }
        };

        const rootSum = this.sumPercentages(ingredients) || 100;
        processList(ingredients, rootSum / 100);
        return Array.from(mergedMap.values());
      }

      /**
       * Expands a single sub-accord row at `rowIndex` in-place into its constituent rows.
       */
      static expandSingleAccordRow(ingredients, rowIndex, formulaMap) {
        const targetRow = ingredients[rowIndex];
        if (!targetRow || targetRow.type !== "accord" || !formulaMap[targetRow.subFormulaId]) {
          return ingredients;
        }
        const subFormula = formulaMap[targetRow.subFormulaId];
        const subSum = this.sumPercentages(subFormula.ingredients) || 100;
        const parentAllocation = Number(targetRow.percentage) || 0;
        const parentDilutionFactor = (targetRow.dilution !== undefined ? Number(targetRow.dilution) : 100) / 100;

        const expandedRows = subFormula.ingredients.map(child => {
          const childNorm = (Number(child.percentage) || 0) / subSum;
          const childDil = child.dilution !== undefined ? Number(child.dilution) : 100;
          return {
            type: child.type || "ingredient",
            ingredientId: child.ingredientId,
            subFormulaId: child.subFormulaId,
            nameSnapshot: child.nameSnapshot,
            percentage: parentAllocation * childNorm,
            dilution: Number((childDil * parentDilutionFactor).toFixed(2)),
            solvent: child.solvent || targetRow.solvent || "Neat",
            locked: false,
            note: `Expanded from ${subFormula.name}`
          };
        });

        const next = [...ingredients];
        next.splice(rowIndex, 1, ...expandedRows);

        // Merge any duplicate raw materials with identical dilution/solvent
        const consolidated = [];
        for (const item of next) {
          if (item.type !== "accord") {
            const existing = consolidated.find(
              x => x.type !== "accord" && x.ingredientId === item.ingredientId && Number(x.dilution || 100) === Number(item.dilution || 100)
            );
            if (existing) {
              existing.percentage += item.percentage;
              continue;
            }
          }
          consolidated.push(item);
        }
        return consolidated;
      }

      static autoBalance(ingredients, changedIdx, newPct, strategy = "proportional") {
        const clampedTarget = Math.max(0, Math.min(100, Number(newPct) || 0));
        const lockedSum = ingredients.reduce((acc, it, idx) => (it.locked && idx !== changedIdx ? acc + (Number(it.percentage) || 0) : acc), 0);
        const maxAllowed = Math.max(0, 100 - lockedSum);
        const effectiveTarget = Math.min(clampedTarget, maxAllowed);

        const unlockedIndices = ingredients
          .map((it, idx) => (!it.locked && idx !== changedIdx ? idx : -1))
          .filter(idx => idx !== -1);

        if (unlockedIndices.length === 0) {
          return {
            success: false,
            ingredients,
            error: "All other materials are locked. Unlock at least one material to auto-balance."
          };
        }

        const next = ingredients.map(it => ({ ...it }));
        const oldPct = Number(next[changedIdx].percentage) || 0;
        const delta = effectiveTarget - oldPct;
        next[changedIdx].percentage = effectiveTarget;

        const unlockedTotal = unlockedIndices.reduce((acc, idx) => acc + (Number(next[idx].percentage) || 0), 0);

        if (strategy === "equal" || unlockedTotal <= 0.0001) {
          const share = delta / unlockedIndices.length;
          unlockedIndices.forEach(idx => {
            next[idx].percentage = Math.max(0, next[idx].percentage - share);
          });
        } else {
          unlockedIndices.forEach(idx => {
            const weight = next[idx].percentage / unlockedTotal;
            next[idx].percentage = Math.max(0, next[idx].percentage - delta * weight);
          });
        }

        const finalSum = this.sumPercentages(next);
        const drift = 100.0 - finalSum;
        if (Math.abs(drift) > 0.00001) {
          const absorbIdx = unlockedIndices.find(idx => next[idx].percentage + drift >= 0) ?? unlockedIndices[0];
          next[absorbIdx].percentage = Math.max(0, next[absorbIdx].percentage + drift);
        }

        return { success: true, ingredients: next };
      }

      static analyzeAccord(formulaIngredients, ingMap, formulaMap = {}, useIntensity = true) {
        const scores = {};
        FAMILIES.forEach(f => (scores[f] = 0));
        const pyramid = { top: 0, heart: 0, base: 0 };

        // Recursively flatten nested sub-accords so radar & pyramid reflect underlying raw materials
        const flatList = this.flattenFormula(formulaIngredients, formulaMap);
        const totalPct = this.sumPercentages(flatList) || 100;

        flatList.forEach(row => {
          const ing = ingMap[row.ingredientId];
          if (!ing) return;
          const dilFactor = (row.dilution !== undefined ? Number(row.dilution) : 100) / 100;
          const normProp = ((Number(row.percentage) || 0) * dilFactor) / totalPct;
          const intensityFactor = useIntensity ? ((Number(ing.intensity) || 50) / 50) : 1.0;

          FAMILIES.forEach(f => {
            const rating = ing.ratings && ing.ratings[f] ? Number(ing.ratings[f]) : 0;
            scores[f] += normProp * rating * intensityFactor;
          });

          if (ing.pyramid) {
            pyramid.top += normProp * (Number(ing.pyramid.top) || 0);
            pyramid.heart += normProp * (Number(ing.pyramid.heart) || 0);
            pyramid.base += normProp * (Number(ing.pyramid.base) || 0);
          }
        });

        const pyrTotal = pyramid.top + pyramid.heart + pyramid.base || 1;
        return {
          families: scores,
          pyramid: {
            top: (pyramid.top / pyrTotal) * 100,
            heart: (pyramid.heart / pyrTotal) * 100,
            base: (pyramid.base / pyrTotal) * 100
          }
        };
      }
    }

    // --- 2. INDEXEDDB STORAGE ---
    class LocalDB {
      constructor() {
        this.dbName = "AttarLabPro_v2";
        this.db = null;
      }

      async open() {
        return new Promise((resolve, reject) => {
          const req = indexedDB.open(this.dbName, 1);
          req.onupgradeneeded = e => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains("ingredients")) db.createObjectStore("ingredients", { keyPath: "id" });
            if (!db.objectStoreNames.contains("formulas")) db.createObjectStore("formulas", { keyPath: "id" });
            if (!db.objectStoreNames.contains("attar_logs")) db.createObjectStore("attar_logs", { keyPath: "id" });
          };
          req.onsuccess = async e => {
            this.db = e.target.result;
            await this.seedIfEmpty();
            resolve();
          };
          req.onerror = () => reject(req.error);
        });
      }

      async seedIfEmpty() {
        const ings = await this.getAll("ingredients");
        if (ings.length === 0) {
          for (const item of SAMPLE_INGREDIENTS) await this.put("ingredients", item);
          for (const form of SAMPLE_FORMULAS) await this.put("formulas", form);
          for (const log of SAMPLE_ATTAR_LOGS) await this.put("attar_logs", log);
        } else {
          // Ensure sample sub-accord exists for upgrades
          const forms = await this.getAll("formulas");
          if (!forms.some(f => f.id === "form_amber_wood_accord")) {
            await this.put("formulas", SAMPLE_FORMULAS[0]);
          }
        }
      }

      async getAll(store) {
        return new Promise((resolve, reject) => {
          const tx = this.db.transaction(store, "readonly");
          const req = tx.objectStore(store).getAll();
          req.onsuccess = () => resolve(req.result || []);
          req.onerror = () => reject(req.error);
        });
      }

      async put(store, record) {
        return new Promise((resolve, reject) => {
          const tx = this.db.transaction(store, "readwrite");
          const req = tx.objectStore(store).put(record);
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      }

      async delete(store, id) {
        return new Promise((resolve, reject) => {
          const tx = this.db.transaction(store, "readwrite");
          const req = tx.objectStore(store).delete(id);
          req.onsuccess = () => resolve(true);
          req.onerror = () => reject(req.error);
        });
      }
    }

        let csv = "Type,Material/Sub-Accord,Dilution (%),Solvent,Formula %,PPT (per 1000),Batch Mass (g),Notes\n";
        f.ingredients.forEach(row => {
          const isAccord = row.type === "accord";
          const name = isAccord
            ? (this.formulaMap[row.subFormulaId]?.name || row.nameSnapshot || "Sub-Accord")
            : (this.ingMap[row.ingredientId]?.name || row.nameSnapshot || "Material");
          const mass = FormulaEngine.calcMass(row.percentage, f.targetBatchSize);
          const ppt = Number(row.percentage) * 10;
          csv += `"${isAccord ? "SUB-ACCORD" : "RAW"}","${name}",${row.dilution ?? 100},"${row.solvent || "Neat"}",${Number(row.percentage).toFixed(2)},${ppt.toFixed(1)},${mass.toFixed(3)},"${(row.note || "").replace(/"/g, '""')}"\n`;
        });
        const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `${(f.name || "Formula").replace(/\s+/g, "_")}_v${f.version || "1.0"}.csv`;

              <span class="hud-label">Raw Materials</span>
              <span class="hud-val">${this.ingredients.length}</span>
              <span class="hud-sub">Attars, Oils & Isolates</span>
            </div>
            <div class="hud-card">
              <span class="hud-label">Deg Distillations</span>
              <span class="hud-val">${this.attarLogs.length}</span>
              <span class="hud-sub">Kannauj Receiver Logs</span>
            </div>
            <div class="hud-card">
              <span class="hud-label">Low Stock Alerts</span>
              <span class="hud-val" style="color:${lowStockCount > 0 ? 'var(--status-warn)' : 'var(--status-ok)'}">${lowStockCount}</span>
              <span class="hud-sub">Below 150g threshold</span>
            </div>
          </div>

          <div class="studio-layout">
            <div class="panel">
              <div class="panel-head"><span class="panel-title">Quick Studio Actions</span></div>
              <div class="panel-body" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
                <button class="btn btn-gold" id="dash-new-formula">+ New Blank Formula</button>
                <button class="btn btn-outline" id="dash-new-accord">+ New Sub-Accord Base</button>
                <button class="btn btn-outline" id="dash-new-ing">+ Create Raw Material</button>
                <button class="btn btn-outline" id="dash-open-batch">Gravimetric Weigh Sheet</button>
              </div>
            </div>

            <div class="panel">
              <div class="panel-head"><span class="panel-title">Saved Formulas & Sub-Accords</span></div>
              <div class="panel-body" style="display:flex;flex-direction:column;gap:8px;">
                ${this.formulas.map(f => `
                  <div class="ing-row-card ${f.isAccord ? "sub-accord-card" : ""}" style="display:flex;justify-content:space-between;align-items:center;cursor:pointer;" data-load-f="${f.id}">
                    <div>
                      <div class="ing-name">
                        ${f.name}
                        ${f.isAccord ? `<span class="accord-pill">❖ ACCORD</span>` : `<span class="ing-cat-badge">v${f.version || "1.0"}</span>`}
                      </div>
                      <div class="hud-sub">${f.ingredients.length} rows • ${f.targetBatchSize}g batch</div>
                    </div>
                    <span class="btn btn-outline btn-sm">Open</span>
                  </div>
                `).join("")}
              </div>
            </div>
          </div>
        `;

        const createBlank = (isAccord = false) => {
          this.pushUndoState();
          this.activeFormula = {
            id: "form_" + Date.now(),
            name: isAccord ? "New Reusable Sub-Accord" : "New Attar Formulation",
            description: isAccord ? "Premix accord for nesting in formulas" : "Experimental formulation",
            type: isAccord ? "Sub-Accord / Premix" : "Traditional Attar",
            isAccord,
            version: "1.0",
            targetBatchSize: 100,
            batchUnit: "g",
            mode: "auto",
            strategy: "proportional",
            ingredients: []
          };
          this.setDirty(true);
          this.navigate("studio");
        };

        vp.querySelector("#dash-new-formula").onclick = () => createBlank(false);
        vp.querySelector("#dash-new-accord").onclick = () => createBlank(true);
        vp.querySelector("#dash-new-ing").onclick = () => this.openMaterialEditor(null);
        vp.querySelector("#dash-open-batch").onclick = () => this.navigate("batch");
        vp.querySelectorAll("[data-load-f]").forEach(el => {
          el.onclick = () => {
            const found = this.formulas.find(x => x.id === el.getAttribute("data-load-f"));
            if (found) {
              this.activeFormula = JSON.parse(JSON.stringify(found));
              this.setDirty(false);
              this.navigate("studio");
            }
          };
        });
      }

      // --- SCREEN 2: FORMULATION STUDIO (NESTED SUB-ACCORDS + DILUTIONS + SORTING) ---
      renderStudio(vp) {
        const f = this.activeFormula;
        vp.innerHTML = `
          <div class="hud-grid">
            <div class="hud-card">
              <span class="hud-label">Formula Total</span>
              <span class="hud-val" id="hud-total-pct">0.00%</span>
              <span class="hud-sub" id="hud-balance-state">Checking...</span>
            </div>
            <div class="hud-card">
              <span class="hud-label">Pure Aromatic Oil</span>
              <span class="hud-val" id="hud-aromatic-pct" style="color:var(--accent-gold-bright)">0.00%</span>
              <span class="hud-sub" id="hud-mat-count">${f.ingredients.length} Rows</span>
            </div>
            <div class="hud-card">
              <span class="hud-label">Est. Batch Cost</span>
              <span class="hud-val" id="hud-batch-cost">${this.currency}0</span>
              <span class="hud-sub" id="hud-gram-cost">${this.currency}0 / g</span>
            </div>
            <div class="hud-card">
              <span class="hud-label">IFRA Cat 4 (Flattened)</span>
              <span class="hud-val" id="hud-ifra-status">OK</span>
              <span class="hud-sub">Includes Sub-Accords</span>
            </div>
          </div>

          <div class="studio-layout">
            <!-- Left Column: Workbench -->
            <div class="panel">
              <div class="panel-head">
                <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
                  <span class="panel-title">Workbench <span class="ing-cat-badge">v${f.version || "1.0"}</span></span>
                  <button class="btn btn-outline btn-sm" id="btn-undo" title="Undo">↶</button>
                  <button class="btn btn-outline btn-sm" id="btn-redo" title="Redo">↷</button>
                  <label style="display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--text-secondary);cursor:pointer;margin-left:4px;">
                    <input type="checkbox" id="chk-is-accord" ${f.isAccord ? "checked" : ""}> Mark as Reusable Sub-Accord
                  </label>
                </div>
                <div style="display:flex;gap:6px;flex-wrap:wrap;">
                  <button class="btn btn-outline btn-sm" id="btn-sort-pyramid" title="Sort Top -> Heart -> Base">Sort T→H→B</button>
                  <button class="btn btn-outline btn-sm" id="btn-sort-pct" title="Sort Highest to Lowest %">Sort %↓</button>
                  <button class="btn btn-outline btn-sm" id="btn-norm-100">100%</button>
                  <button class="btn btn-danger btn-sm" id="btn-clear-all">Clear</button>
                  <button class="btn btn-gold btn-sm" id="btn-open-picker">+ Add Material / Accord</button>
                </div>
              </div>

              <div class="formula-toolbar">
                <div class="field-group">
                  <label class="field-label">Formula / Accord Name (Tap ✕ to clear)</label>
                  <div class="input-clear-wrap">
                    <input type="text" id="studio-form-name" class="input" value="${f.name || ""}" placeholder="Enter formula or accord name...">
                    <button type="button" class="clear-field-btn" id="clear-form-name">✕</button>
                  </div>
                </div>
                <div class="field-group">
                  <label class="field-label">Target Batch (g)</label>
                  <div class="input-clear-wrap">
                    <input type="text" inputmode="decimal" id="studio-batch-size" class="input input-mono" value="${f.targetBatchSize}">
                    <button type="button" class="clear-field-btn" id="clear-batch-size">✕</button>
                  </div>
                </div>
                <div class="field-group">
                  <label class="field-label">Compounding Mode</label>
                  <select id="studio-adj-mode" class="select">
                    <option value="auto" ${f.mode === "auto" ? "selected" : ""}>Mode B: Auto-Balance (100%)</option>
                    <option value="direct" ${f.mode === "direct" ? "selected" : ""}>Mode A: Direct Percentage (%)</option>
                    <option value="mass" ${f.mode === "mass" ? "selected" : ""}>Mode C: Direct Scale Weight (g)</option>
                  </select>
                </div>
              </div>

              <div class="ing-list" id="studio-ing-list"></div>
            </div>

            <!-- Right Column: Olfactory Radar & Pyramid -->
            <div>
              <div class="panel">
                <div class="panel-head">
                  <span class="panel-title">Olfactory Accord Radar</span>
                  <span class="hud-sub">Recursive Sub-Accord Aware</span>
                </div>
                <div class="panel-body">
                  <div class="radar-stage" id="studio-radar-svg"></div>
                  <div style="margin-top:14px;">
                    <div class="field-label">Evaporation Role Distribution (Top / Heart / Base)</div>
                    <div class="pyramid-stack">
                      <div class="pyr-bar-top" id="bar-pyr-top" style="width:33%"></div>
                      <div class="pyr-bar-heart" id="bar-pyr-heart" style="width:33%"></div>
                      <div class="pyr-bar-base" id="bar-pyr-base" style="width:34%"></div>
                    </div>
                    <div class="pyramid-legend-grid">
                      <div class="pyr-chip"><strong style="color:#56cfe1">Top</strong> <div id="txt-pyr-top">0%</div></div>
                      <div class="pyr-chip"><strong style="color:#f2cc8f">Heart</strong> <div id="txt-pyr-heart">0%</div></div>
                      <div class="pyr-chip"><strong style="color:#d4af37">Base</strong> <div id="txt-pyr-base">0%</div></div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;

        vp.querySelector("#btn-undo").onclick = () => this.undo();
        vp.querySelector("#btn-redo").onclick = () => this.redo();
        vp.querySelector("#chk-is-accord").onchange = e => {
          this.activeFormula.isAccord = e.target.checked;
          this.activeFormula.type = e.target.checked ? "Sub-Accord / Premix" : "Traditional Attar";
          this.setDirty(true);
          this.toast(e.target.checked ? "Marked as reusable Sub-Accord" : "Marked as Standard Formula");
        };

        // Sort by Note Pyramid (Top -> Heart -> Base)
        vp.querySelector("#btn-sort-pyramid").onclick = () => {
          this.pushUndoState();
          const roleScore = row => {
            if (row.type === "accord") return 2;
            const ing = this.ingMap[row.ingredientId];
            if (!ing || !ing.pyramid) return 2;
            const { top = 0, heart = 0, base = 0 } = ing.pyramid;
            if (top >= heart && top >= base) return 1;
            if (heart >= top && heart >= base) return 2;
            return 3;
          };
          this.activeFormula.ingredients.sort((a, b) => roleScore(a) - roleScore(b));
          this.setDirty(true);
          this.buildIngredientCards();
          this.syncStudioDOMValues();
          this.toast("Sorted Top → Heart → Base");
        };

        // Sort by Percentage (High -> Low)
        vp.querySelector("#btn-sort-pct").onclick = () => {
          this.pushUndoState();
          this.activeFormula.ingredients.sort((a, b) => (Number(b.percentage) || 0) - (Number(a.percentage) || 0));
          this.setDirty(true);
          this.buildIngredientCards();
          this.syncStudioDOMValues();
          this.toast("Sorted by highest concentration");
        };

        vp.querySelector("#btn-clear-all").onclick = async () => {
          if (this.activeFormula.ingredients.length === 0) return;
          const ok = await this.confirmDialog("Clear Workbench?", "Remove all rows from the current workbench? (You can Undo with ↶).", "Clear All");
          if (ok) {
            this.pushUndoState();
            this.activeFormula.ingredients = [];
            this.setDirty(true);
            this.buildIngredientCards();
            this.syncStudioDOMValues();
          }
        };

        const nameInput = vp.querySelector("#studio-form-name");
        nameInput.addEventListener("input", e => {
          this.activeFormula.name = e.target.value;
          this.setDirty(true);
        });
        vp.querySelector("#clear-form-name").onclick = () => {
          nameInput.value = "";
          this.activeFormula.name = "";
          this.setDirty(true);
          nameInput.focus();
        };

        const batchInput = vp.querySelector("#studio-batch-size");
        batchInput.addEventListener("input", e => {
          const raw = e.target.value.trim();
          if (raw === "") return;
          const parsed = parseFloat(raw);
          if (!isNaN(parsed) && parsed > 0) {
            this.activeFormula.targetBatchSize = parsed;
            this.setDirty(true);
            this.syncStudioDOMValues();
          }
        });
        batchInput.addEventListener("blur", e => {
          const parsed = parseFloat(e.target.value);
          if (isNaN(parsed) || parsed <= 0) this.activeFormula.targetBatchSize = 100;
          e.target.value = this.activeFormula.targetBatchSize;
          this.syncStudioDOMValues();
        });
        vp.querySelector("#clear-batch-size").onclick = () => {
          batchInput.value = "";
          batchInput.focus();
        };

        vp.querySelector("#studio-adj-mode").addEventListener("change", e => {
          this.activeFormula.mode = e.target.value;
          this.setDirty(true);
          this.buildIngredientCards();
          this.syncStudioDOMValues();
        });

        vp.querySelector("#btn-norm-100").addEventListener("click", () => {
          const sum = FormulaEngine.sumPercentages(this.activeFormula.ingredients);
          if (sum <= 0) return;
          this.pushUndoState();
          this.activeFormula.ingredients.forEach(it => {
            it.percentage = (it.percentage / sum) * 100;
          });
          this.setDirty(true);
          this.syncStudioDOMValues();
          this.toast("Normalized to 100.00%");
        });

        vp.querySelector("#btn-open-picker").addEventListener("click", () => this.openIngredientModal());

        this.buildIngredientCards();
        this.syncStudioDOMValues();
      }

      buildIngredientCards() {
        const listEl = document.getElementById("studio-ing-list");
        if (!listEl) return;
        listEl.innerHTML = "";

        const f = this.activeFormula;
        const isMassMode = f.mode === "mass";

        if (f.ingredients.length === 0) {
          listEl.innerHTML = `<div style="padding:28px;text-align:center;color:var(--text-secondary);">Workbench is empty. Tap <strong>+ Add Material / Accord</strong> to add raw materials or nested sub-accords.</div>`;
          return;
        }

        f.ingredients.forEach((row, idx) => {
          const isAccord = row.type === "accord";
          const subForm = isAccord ? this.formulaMap[row.subFormulaId] : null;
          const ing = !isAccord
            ? (this.ingMap[row.ingredientId] || { name: row.nameSnapshot || "Archived Material", category: "Archived" })
            : { name: subForm ? subForm.name : (row.nameSnapshot || "Nested Sub-Accord"), category: "Sub-Accord" };

          const currentMass = FormulaEngine.calcMass(row.percentage, f.targetBatchSize);
          const curDil = row.dilution !== undefined ? Number(row.dilution) : 100;
          const curSolvent = row.solvent || "Neat";

          const card = document.createElement("div");
          card.className = `ing-row-card ${row.locked ? "is-locked" : ""} ${isAccord ? "sub-accord-card" : ""}`;

          card.innerHTML = `
            <div class="ing-row-top">
              <div class="ing-row-title-wrap">
                <button type="button" class="lock-toggle ${row.locked ? "locked" : ""}" title="${row.locked ? "Unlock" : "Lock"}">
                  ${row.locked ? "🔒" : "🔓"}
                </button>
                <div style="min-width:0;flex:1;">
                  <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
                    <span class="ing-name">${ing.name}</span>
                    ${isAccord ? `<span class="accord-pill">❖ SUB-ACCORD</span>` : `<span class="ing-cat-badge">${ing.category}</span>`}
                  </div>
                  <div style="display:flex;align-items:center;gap:6px;margin-top:4px;flex-wrap:wrap;">
                    <select class="mini-select" data-dil-idx="${idx}" title="Stock Dilution Strength">
                      ${DILUTION_PRESETS.map(d => `<option value="${d}" ${curDil === d ? "selected" : ""}>${d}% ${d === 100 ? "Neat" : "Dil."}</option>`).join("")}
                    </select>
                    <select class="mini-select" data-solv-idx="${idx}" title="Carrier Solvent" style="${curDil === 100 ? "display:none;" : ""}">
                      ${SOLVENT_PRESETS.filter(s => s !== "Neat").map(s => `<option value="${s}" ${curSolvent === s ? "selected" : ""}>in ${s}</option>`).join("")}
                    </select>
                    <input type="text" class="input" data-note-idx="${idx}" value="${row.note || ""}" placeholder="Bench note..." style="padding:2px 6px;font-size:11px;height:22px;max-width:155px;">
                  </div>
                </div>
              </div>

              <div style="display:flex;align-items:center;gap:5px;flex-wrap:wrap;">
                ${isAccord ? `
                  <button type="button" class="btn btn-outline btn-sm" data-inspect-accord="${idx}" title="Inspect sub-accord formula">🔍</button>
                  <button type="button" class="btn btn-gold btn-sm" data-expand-accord="${idx}" title="Expand sub-accord into raw materials">⚡ Expand</button>
                ` : `
                  <button type="button" class="btn btn-outline btn-sm btn-icon" data-edit-mat="${row.ingredientId}" title="Edit material specs">✎</button>
                `}
                <span class="ing-mass-readout" data-mass-idx="${idx}">${isMassMode ? `${Number(row.percentage).toFixed(2)}%` : `${currentMass.toFixed(2)} g`}</span>
                <button type="button" class="btn btn-danger btn-sm btn-icon" data-del-row="${idx}" title="Remove row">🗑</button>
              </div>
            </div>

            <div class="ing-row-controls">
              <button type="button" class="step-btn" data-step="-0.5" ${row.locked ? "disabled" : ""}>−</button>
              <input type="range" class="range-slider" min="0" max="100" step="0.1" value="${row.percentage}" data-slider-idx="${idx}" ${row.locked ? "disabled" : ""}>
              <button type="button" class="step-btn" data-step="0.5" ${row.locked ? "disabled" : ""}>+</button>
              <div class="pct-input-wrap" style="width:92px;">
                <input type="text" inputmode="decimal" class="pct-input" value="${isMassMode ? currentMass.toFixed(2) : Number(row.percentage).toFixed(2)}" data-num-idx="${idx}" ${row.locked ? "disabled" : ""}>
                <span class="pct-unit">${isMassMode ? "g" : "%"}</span>
              </div>
            </div>
          `;

          // Lock toggle
          card.querySelector(".lock-toggle").onclick = () => {
            this.pushUndoState();
            row.locked = !row.locked;
            this.setDirty(true);
            this.buildIngredientCards();
            this.syncStudioDOMValues();
          };

          // Dilution & Solvent selectors
          const dilSel = card.querySelector(`[data-dil-idx="${idx}"]`);
          const solvSel = card.querySelector(`[data-solv-idx="${idx}"]`);
          dilSel.onchange = e => {
            this.pushUndoState();
            row.dilution = parseFloat(e.target.value) || 100;
            if (row.dilution === 100) {
              row.solvent = "Neat";
              solvSel.style.display = "none";
            } else {
              if (!row.solvent || row.solvent === "Neat") row.solvent = "DPG";
              solvSel.style.display = "inline-block";
              solvSel.value = row.solvent;
            }
            this.setDirty(true);
            this.syncStudioDOMValues();
          };
          solvSel.onchange = e => {
            row.solvent = e.target.value;
            this.setDirty(true);
          };

          // Note input
          card.querySelector(`[data-note-idx="${idx}"]`).addEventListener("input", e => {
            row.note = e.target.value;
            this.setDirty(true);
          });

          // Sub-Accord Inspect & Expand buttons
          if (isAccord) {
            card.querySelector(`[data-inspect-accord="${idx}"]`).onclick = () => this.inspectSubAccord(row);
            card.querySelector(`[data-expand-accord="${idx}"]`).onclick = async () => {
              const ok = await this.confirmDialog(
                `Expand "${ing.name}"?`,
                `Replace this sub-accord row (${Number(row.percentage).toFixed(2)}%) with its constituent raw materials scaled to match the exact batch percentages?`,
                "Expand to Raw Materials"
              );
              if (!ok) return;
              this.pushUndoState();
              this.activeFormula.ingredients = FormulaEngine.expandSingleAccordRow(
                this.activeFormula.ingredients,
                idx,
                this.formulaMap
              );
              this.setDirty(true);
              this.buildIngredientCards();
              this.syncStudioDOMValues();
              this.toast(`Expanded ${ing.name} into raw materials`);
            };
          } else {
            const editBtn = card.querySelector(`[data-edit-mat]`);
            if (editBtn) {
              editBtn.onclick = () => {
                const mat = this.ingMap[row.ingredientId];
                if (mat) this.openMaterialEditor(mat);
              };
            }
          }

          // Delete Row
          card.querySelector(`[data-del-row="${idx}"]`).onclick = () => {
            this.pushUndoState();
            this.activeFormula.ingredients.splice(idx, 1);
            this.setDirty(true);
            this.buildIngredientCards();
            this.syncStudioDOMValues();
            this.toast(`Removed ${ing.name}`);
          };

          // Touch-safe Slider
          const slider = card.querySelector(".range-slider");
          slider.addEventListener("change", () => this.pushUndoState());
          slider.addEventListener("input", e => {
            this.applyProportionChange(idx, parseFloat(e.target.value) || 0, false);
          });

          // Android Backspace-Safe Numeric Input
          const numInput = card.querySelector(".pct-input");
          numInput.addEventListener("focus", () => {
            this.pushUndoState();
            numInput.select();
          });
          numInput.addEventListener("input", e => {
            const raw = e.target.value.trim();
            if (raw === "" || raw === ".") return;
            const val = parseFloat(raw);
            if (!isNaN(val) && val >= 0) {
              this.applyProportionChange(idx, val, isMassMode);
            }
          });
          numInput.addEventListener("blur", e => {
            const raw = e.target.value.trim();
            const val = raw === "" ? 0 : parseFloat(raw);
            this.applyProportionChange(idx, isNaN(val) ? 0 : val, isMassMode);
            const updatedMass = FormulaEngine.calcMass(this.activeFormula.ingredients[idx].percentage, f.targetBatchSize);
            numInput.value = isMassMode
              ? updatedMass.toFixed(2)
              : Number(this.activeFormula.ingredients[idx].percentage).toFixed(2);
          });

          // +/- Step buttons
          card.querySelectorAll(".step-btn").forEach(btn => {
            btn.onclick = () => {
              this.pushUndoState();
              const delta = parseFloat(btn.getAttribute("data-step"));
              if (isMassMode) {
                const curG = FormulaEngine.calcMass(row.percentage, f.targetBatchSize);
                this.applyProportionChange(idx, Math.max(0, curG + delta), true);
              } else {
                const nextVal = Math.max(0, Math.min(100, (Number(row.percentage) || 0) + delta));
                this.applyProportionChange(idx, nextVal, false);
              }
            };
          });

          listEl.appendChild(card);
        });
      }

      inspectSubAccord(row) {
        const sub = this.formulaMap[row.subFormulaId];
        const modal = document.getElementById("modal-accord-inspect");
        const body = document.getElementById("accord-inspect-body");
        if (!sub) {
          this.toast("Sub-accord formula record not found");
          return;
        }
        document.getElementById("accord-inspect-title").textContent = `❖ ${sub.name} (${Number(row.percentage).toFixed(2)}% in Formula)`;
        const subSum = FormulaEngine.sumPercentages(sub.ingredients) || 100;

        body.innerHTML = `
          <p class="hud-sub" style="margin-bottom:12px;">${sub.description || "Reusable sub-accord premix."}</p>
          <div class="table-scroll">
            <table class="data-table" style="min-width:320px;">
              <thead>
                <tr>
                  <th>Constituent</th>
                  <th>In Accord %</th>
                  <th>Effective in Parent %</th>
                  <th>Batch Mass (g)</th>
                </tr>
              </thead>
              <tbody>
                ${sub.ingredients.map(c => {
                  const effPct = (Number(row.percentage) * (Number(c.percentage) / subSum));
                  const effMass = FormulaEngine.calcMass(effPct, this.activeFormula.targetBatchSize);
                  const cName = c.type === "accord"
                    ? (this.formulaMap[c.subFormulaId]?.name || c.nameSnapshot)
                    : (this.ingMap[c.ingredientId]?.name || c.nameSnapshot);
                  return `
                    <tr>
                      <td><strong>${cName}</strong></td>
                      <td class="input-mono">${Number(c.percentage).toFixed(2)}%</td>
                      <td class="input-mono" style="color:var(--accent-gold-bright)">${effPct.toFixed(3)}%</td>
                      <td class="input-mono">${effMass.toFixed(3)} g</td>
                    </tr>
                  `;
                }).join("")}
              </tbody>
            </table>
          </div>
        `;
        modal.classList.add("open");
      }

      applyProportionChange(idx, inputVal, isGramInput = false) {
        const f = this.activeFormula;
        if (isGramInput) {
          const masses = f.ingredients.map((r, i) =>
            i === idx ? Math.max(0, inputVal) : FormulaEngine.calcMass(r.percentage, f.targetBatchSize)
          );
          const newTotalMass = masses.reduce((a, b) => a + b, 0);
          if (newTotalMass > 0) {
            f.targetBatchSize = Number(newTotalMass.toFixed(2));
            f.ingredients.forEach((r, i) => {
              r.percentage = (masses[i] / newTotalMass) * 100;
            });
          }
          const batchInput = document.getElementById("studio-batch-size");
          if (batchInput && document.activeElement !== batchInput) {
            batchInput.value = f.targetBatchSize;
          }
        } else if (f.mode === "auto" && f.ingredients.length > 1) {
          const res = FormulaEngine.autoBalance(f.ingredients, idx, inputVal, f.strategy || "proportional");
          if (res.success) {
            f.ingredients = res.ingredients;
          } else {
            f.ingredients[idx].percentage = Math.max(0, Math.min(100, inputVal));
          }
        } else {
          f.ingredients[idx].percentage = Math.max(0, Math.min(100, inputVal));
        }
        this.setDirty(true);
        this.syncStudioDOMValues();
      }

      syncStudioDOMValues() {
        const f = this.activeFormula;
        const isMassMode = f.mode === "mass";

        // Update row sliders & mass readouts
        f.ingredients.forEach((row, idx) => {
          const mass = FormulaEngine.calcMass(row.percentage, f.targetBatchSize);
          const sliderEl = document.querySelector(`[data-slider-idx="${idx}"]`);
          const numEl = document.querySelector(`[data-num-idx="${idx}"]`);
          const massEl = document.querySelector(`[data-mass-idx="${idx}"]`);

          if (sliderEl && document.activeElement !== sliderEl) sliderEl.value = row.percentage;
          if (numEl && document.activeElement !== numEl) {
            numEl.value = isMassMode ? mass.toFixed(2) : Number(row.percentage).toFixed(2);
          }
          if (massEl) {
            massEl.textContent = isMassMode ? `${Number(row.percentage).toFixed(2)}%` : `${mass.toFixed(2)} g`;
          }
        });

        // Flatten nested sub-accords for accurate cost & IFRA compliance checks
        const flatIngredients = FormulaEngine.flattenFormula(f.ingredients, this.formulaMap);
        let totalCost = 0;
        let ifraViolations = 0;

        flatIngredients.forEach(row => {
          const ing = this.ingMap[row.ingredientId] || {};
          const dilFactor = (row.dilution !== undefined ? Number(row.dilution) : 100) / 100;
          const mass = FormulaEngine.calcMass(row.percentage, f.targetBatchSize);
          totalCost += mass * dilFactor * ((ing.pricePerKg || 0) / 1000);
          const activePct = row.percentage * dilFactor;
          if (ing.ifraLimitCat4 && activePct > ing.ifraLimitCat4) ifraViolations++;
        });

        const totalPct = FormulaEngine.sumPercentages(f.ingredients);
        const aromaticPct = FormulaEngine.calcActiveAromaticPercent(flatIngredients);
        const balanced = Math.abs(100 - totalPct) < 0.05;

        const pctEl = document.getElementById("hud-total-pct");
        const stateEl = document.getElementById("hud-balance-state");
        const aroEl = document.getElementById("hud-aromatic-pct");
        const countEl = document.getElementById("hud-mat-count");
        const costEl = document.getElementById("hud-batch-cost");
        const gCostEl = document.getElementById("hud-gram-cost");
        const ifraEl = document.getElementById("hud-ifra-status");

        if (pctEl) {
          pctEl.textContent = `${totalPct.toFixed(2)}%`;
          pctEl.style.color = balanced ? "var(--status-ok)" : "var(--status-warn)";
        }
        if (stateEl) stateEl.textContent = balanced ? `Balanced (${(totalPct * 10).toFixed(0)}‰)` : `Delta: ${(100 - totalPct).toFixed(2)}%`;
        if (aroEl) aroEl.textContent = `${aromaticPct.toFixed(2)}%`;
        if (countEl) countEl.textContent = `${f.ingredients.length} Rows (${flatIngredients.length} Raw)`;
        if (costEl) costEl.textContent = `${this.currency}${totalCost.toFixed(0)}`;
        if (gCostEl) gCostEl.textContent = `${this.currency}${(totalCost / (f.targetBatchSize || 1)).toFixed(2)} / g`;
        if (ifraEl) {
          ifraEl.textContent = ifraViolations === 0 ? "PASS" : `${ifraViolations} Alert`;
          ifraEl.style.color = ifraViolations === 0 ? "var(--status-ok)" : "var(--status-err)";
        }

        const analysis = FormulaEngine.analyzeAccord(f.ingredients, this.ingMap, this.formulaMap, true);
        this.drawRadarSVG("studio-radar-svg", analysis.families);

        const topB = document.getElementById("bar-pyr-top");
        const heartB = document.getElementById("bar-pyr-heart");
        const baseB = document.getElementById("bar-pyr-base");
        if (topB && heartB && baseB) {
          topB.style.width = `${analysis.pyramid.top}%`;
          heartB.style.width = `${analysis.pyramid.heart}%`;
          baseB.style.width = `${analysis.pyramid.base}%`;
          document.getElementById("txt-pyr-top").textContent = `${analysis.pyramid.top.toFixed(1)}%`;
          document.getElementById("txt-pyr-heart").textContent = `${analysis.pyramid.heart.toFixed(1)}%`;
          document.getElementById("txt-pyr-base").textContent = `${analysis.pyramid.base.toFixed(1)}%`;
        }
      }

      drawRadarSVG(containerId, familyScores) {
        const box = document.getElementById(containerId);
        if (!box) return;
        const keys = FAMILIES;
        const N = keys.length;
        const size = 240, cx = 120, cy = 120, R = 82;

        let rings = "";
        [0.25, 0.5, 0.75, 1].forEach(r => {
          rings += `<circle cx="${cx}" cy="${cy}" r="${R * r}" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>`;
        });

        let spokes = "";
        const pts = [];
        keys.forEach((k, i) => {
          const angle = (Math.PI * 2 * i) / N - Math.PI / 2;
          const x2 = cx + Math.cos(angle) * R;
          const y2 = cy + Math.sin(angle) * R;
          spokes += `<line x1="${cx}" y1="${cy}" x2="${x2}" y2="${y2}" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>`;

          const val = Math.min(100, Math.max(0, familyScores[k] || 0));
          const pr = (val / 100) * R;
          pts.push(`${(cx + Math.cos(angle) * pr).toFixed(1)},${(cy + Math.sin(angle) * pr).toFixed(1)}`);

          const lx = cx + Math.cos(angle) * (R + 19);
          const ly = cy + Math.sin(angle) * (R + 19);
          spokes += `<text x="${lx}" y="${ly}" fill="var(--text-secondary)" font-size="8.5" font-weight="600" text-anchor="middle" dominant-baseline="central">${k.slice(0, 4).toUpperCase()}</text>`;
        });

        box.innerHTML = `
          <svg viewBox="0 0 ${size} ${size}" width="100%" height="235" style="max-width:260px;">
            ${rings}
            ${spokes}
            <polygon points="${pts.join(" ")}" fill="rgba(212, 175, 55, 0.28)" stroke="var(--accent-gold-bright)" stroke-width="2"/>
          </svg>
        `;
      }

      // --- UPGRADED PICKER MODAL: RAW MATERIALS OR NESTED SUB-ACCORDS ---
      openIngredientModal() {
        const modal = document.getElementById("modal-ing-picker");
        const search = document.getElementById("ing-picker-search");
        const results = document.getElementById("ing-picker-results");
        modal.classList.add("open");

        let pickerMode = "raw"; // "raw" | "accord"

        const renderList = (q = "") => {
          const term = q.toLowerCase();
          const tabsHTML = `
            <div class="picker-tabs">
              <button type="button" class="btn ${pickerMode === "raw" ? "btn-gold" : "btn-outline"} btn-sm" id="tab-pick-raw">Raw Materials (${this.ingredients.length})</button>
              <button type="button" class="btn ${pickerMode === "accord" ? "btn-gold" : "btn-outline"} btn-sm" id="tab-pick-accord">❖ Saved Sub-Accords (${this.formulas.length})</button>
            </div>
          `;

          if (pickerMode === "raw") {
            const filtered = this.ingredients.filter(i =>
              i.name.toLowerCase().includes(term) ||
              i.category.toLowerCase().includes(term) ||
              (i.botanicalName && i.botanicalName.toLowerCase().includes(term))
            );

            results.innerHTML = tabsHTML + filtered.map(ing => `
              <div class="ing-row-card" style="display:flex;justify-content:space-between;align-items:center;cursor:pointer;" data-pick-id="${ing.id}">
                <div>
                  <div class="ing-name">${ing.name}</div>
                  <div class="hud-sub">${ing.category} • ${this.currency}${((ing.pricePerKg || 0) / 1000).toFixed(1)}/g • IFRA: ${ing.ifraLimitCat4 ?? 100}%</div>
                </div>
                <button class="btn btn-gold btn-sm">+ Add</button>
              </div>
            `).join("");
          } else {
            const candidateFormulas = this.formulas.filter(f =>
              f.id !== this.activeFormula.id &&
              (f.name.toLowerCase().includes(term) || (f.description && f.description.toLowerCase().includes(term)))
            );

            results.innerHTML = tabsHTML + (candidateFormulas.length === 0
              ? `<div style="padding:18px;text-align:center;color:var(--text-secondary);">No other saved formulas/accords available to nest.</div>`
              : candidateFormulas.map(sub => `
                <div class="ing-row-card sub-accord-card" style="display:flex;justify-content:space-between;align-items:center;cursor:pointer;" data-pick-accord="${sub.id}">
                  <div>
                    <div class="ing-name">❖ ${sub.name} <span class="ing-cat-badge">v${sub.version || "1.0"}</span></div>
                    <div class="hud-sub">${sub.ingredients.length} components • ${sub.description || "Reusable sub-accord"}</div>
                  </div>
                  <button class="btn btn-gold btn-sm">+ Nest Accord</button>
                </div>
              `).join(""));
          }

          results.querySelector("#tab-pick-raw").onclick = () => {
            pickerMode = "raw";
            renderList(search.value);
          };
          results.querySelector("#tab-pick-accord").onclick = () => {
            pickerMode = "accord";
            renderList(search.value);
          };

          results.querySelectorAll("[data-pick-id]").forEach(el => {
            el.onclick = () => {
              const id = el.getAttribute("data-pick-id");
              const ingObj = this.ingMap[id];
              this.pushUndoState();
              this.activeFormula.ingredients.push({
                type: "ingredient",
                ingredientId: id,
                nameSnapshot: ingObj ? ingObj.name : "Material",
                percentage: 5.0,
                dilution: 100,
                solvent: "Neat",
                locked: false,
                note: ""
              });
              modal.classList.remove("open");
              this.setDirty(true);
              this.buildIngredientCards();
              this.syncStudioDOMValues();
              this.toast(`Added ${ingObj ? ingObj.name : "material"}`);
            };
          });

          results.querySelectorAll("[data-pick-accord]").forEach(el => {
            el.onclick = () => {
              const subId = el.getAttribute("data-pick-accord");
              const subObj = this.formulaMap[subId];
              if (!subObj) return;

              // Check for circular dependency
              const tempMap = { ...this.formulaMap, [this.activeFormula.id]: this.activeFormula };
              if (FormulaEngine.hasCircularReference(this.activeFormula.id, subId, tempMap)) {
                this.toast("Blocked: Circular sub-accord reference detected!");
                return;
              }

              this.pushUndoState();
              this.activeFormula.ingredients.push({
                type: "accord",
                subFormulaId: subId,
                nameSnapshot: subObj.name,
                percentage: 10.0,
                dilution: 100,
                solvent: "Neat",
                locked: false,
                note: "Nested Sub-Accord"
              });
              modal.classList.remove("open");
              this.setDirty(true);
              this.buildIngredientCards();
              this.syncStudioDOMValues();
              this.toast(`Nested sub-accord "${subObj.name}"`);
            };
          });
        };

        search.value = "";
        search.oninput = e => renderList(e.target.value);
        renderList();
      }

            btn.onclick = async () => {
              const orig = this.ingMap[btn.getAttribute("data-mat-dup")];
              if (!orig) return;
              const copy = JSON.parse(JSON.stringify(orig));
              copy.id = "ing_" + Date.now();
              copy.name = orig.name + " (Copy)";
              await this.db.put("ingredients", copy);
              await this.reloadDatabase();
              renderItems(searchInput.value);
              this.toast(`Duplicated ${orig.name}`);
            };
          });

          listBox.querySelectorAll("[data-mat-del]").forEach(btn => {
            btn.onclick = async () => {
              const id = btn.getAttribute("data-mat-del");
              const mat = this.ingMap[id];
              if (!mat) return;
              const usedIn = this.formulas.filter(f => f.ingredients.some(r => r.ingredientId === id));
              const warningText = usedIn.length > 0
                ? `"${mat.name}" is referenced in ${usedIn.length} saved formula(s). Deleting it removes it from the library while preserving its snapshot name inside existing formulas.`
                : `Permanently delete "${mat.name}" from your Ingredient Library?`;

              const confirmed = await this.confirmDialog(`Delete ${mat.name}?`, warningText, "Delete Material");
              if (!confirmed) return;

              await this.db.delete("ingredients", id);
              await this.reloadDatabase();
              renderItems(searchInput.value);
              this.toast(`Deleted ${mat.name}`);
            };
          });
        };

        searchInput.oninput = e => renderItems(e.target.value);
        vp.querySelector("#clear-lib-search").onclick = () => {
          searchInput.value = "";
          renderItems("");
          searchInput.focus();
        };
        vp.querySelector("#btn-new-ing").onclick = () => this.openMaterialEditor(null);

        renderItems();
      }

      // --- SCREEN 4: ACCORD ANALYZER ---
      renderAnalyzer(vp) {
        const analysis = FormulaEngine.analyzeAccord(this.activeFormula.ingredients, this.ingMap, this.formulaMap, true);
        vp.innerHTML = `
          <div class="studio-layout">
            <div class="panel">
              <div class="panel-head"><span class="panel-title">13-Dimension Olfactory Profile (Recursive)</span></div>
              <div class="panel-body">
                ${FAMILIES.map(f => {
                  const val = Math.min(100, analysis.families[f] || 0);
                  return `
                    <div class="profile-bar-row">
                      <span style="text-transform:capitalize;color:var(--text-secondary);">${f}</span>
                      <div class="profile-track"><div class="profile-fill" style="width:${val.toFixed(1)}%"></div></div>
                      <span class="input-mono" style="font-size:11px;">${val.toFixed(0)}</span>
                    </div>
                  `;
                }).join("")}
              </div>
            </div>

            <div class="panel">
              <div class="panel-head"><span class="panel-title">Experimental Accord Optimizer</span></div>
              <div class="panel-body">
                <p class="hud-sub" style="margin-bottom:12px;">Select a target olfactory facet and apply recommended adjustments directly to your active formula:</p>
                <div style="display:flex;gap:8px;margin-bottom:14px;">
                  <select id="opt-target-family" class="select">
                    ${FAMILIES.map(f => `<option value="${f}">Boost ${f.toUpperCase()} character</option>`).join("")}
                  </select>
                </div>
                <div id="opt-suggestions-box" style="display:flex;flex-direction:column;gap:8px;"></div>
              </div>
            </div>
          </div>
        `;

        const runSuggestions = () => {
          const fam = vp.querySelector("#opt-target-family").value;
          const candidates = [...this.ingredients]
            .filter(i => (i.ratings && i.ratings[fam] > 25))
            .sort((a, b) => (b.ratings[fam] || 0) - (a.ratings[fam] || 0))
            .slice(0, 4);

          const box = vp.querySelector("#opt-suggestions-box");
          box.innerHTML = candidates.map(c => `
            <div class="ing-row-card" style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
              <div>
                <div class="ing-name">${c.name}</div>
                <div class="hud-sub">${fam.toUpperCase()} Score: <strong>${c.ratings[fam]}/100</strong> • IFRA Max: ${c.ifraLimitCat4}%</div>
              </div>
              <button class="btn btn-gold btn-sm" data-apply-rec="${c.id}">+2.5% Trial</button>
            </div>
          `).join("");

          box.querySelectorAll("[data-apply-rec]").forEach(btn => {
            btn.onclick = () => {
              const id = btn.getAttribute("data-apply-rec");
              const mat = this.ingMap[id];
              this.pushUndoState();
              const existing = this.activeFormula.ingredients.find(x => x.type !== "accord" && x.ingredientId === id);
              if (existing) {
                existing.percentage = Math.min(100, Number(existing.percentage) + 2.5);
              } else {
                this.activeFormula.ingredients.push({
                  type: "ingredient",
                  ingredientId: id,
                  nameSnapshot: mat.name,
                  percentage: 2.5,
                  dilution: 100,
                  solvent: "Neat",
                  locked: false,
                  note: `Added for ${fam} boost`
                });
              }
              this.setDirty(true);
              this.toast(`Applied +2.5% ${mat.name}`);
              this.navigate("studio");
            };
          });
        };

        vp.querySelector("#opt-target-family").onchange = runSuggestions;
        runSuggestions();
      }

      // --- SCREEN 5: TRADITIONAL ATTAR DEG LOG ---
      renderAttarWorkspace(vp) {

        vp.querySelectorAll("[data-del-deg]").forEach(btn => {
